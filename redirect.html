<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
</head>
<body>
    <p>잠시만 기다려 주세요...</p>

    <script>
        console.log("Redirect 페이지 실행됨");

        function getTrackingData() {
            const urlParams = new URLSearchParams(window.location.search);
            let blogUrl = urlParams.get("blog_url") || document.referrer || "Direct Visit";
            let searchKeyword = "";

            if (document.referrer.includes("naver.com/search.naver")) {
                searchKeyword = new URL(document.referrer).searchParams.get("query") || "";
            } else if (document.referrer.includes("google.com/search")) {
                searchKeyword = new URL(document.referrer).searchParams.get("q") || "";
            }

            console.log("최종 블로그 URL:", blogUrl);
            console.log("검색 키워드:", searchKeyword);

            return { blogUrl, searchKeyword };
        }

        function sendDataToGoogleSheets() {
            let { blogUrl, searchKeyword } = getTrackingData();

            const sheetUrl = "https://script.google.com/macros/s/AKfycbwfMBuwEvWPOy0S8ZN4xgVRD7K9JGF-k3R9Xk8M_XwVk_U6t3Ol1VC4N37w8vhub2fg/exec"; 
            const sendData = {
                blogUrl: blogUrl,
                searchKeyword: searchKeyword,
                timestamp: new Date().toISOString()
            };

            fetch(sheetUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(sendData)
            });

            setTimeout(() => {
                window.location.replace("https://www.orozi.kr");
            }, 1000);
        }

        window.onload = sendDataToGoogleSheets;
    </script>
</body>
</html>
