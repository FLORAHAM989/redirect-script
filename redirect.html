<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        console.log("Redirect 페이지 실행됨");

        function fetchLatestBlogUrl() {
            const apiUrl = "https://script.google.com/macros/s/AKfycbyP4u2E-NQuY7Q9eKWpViLcQHxCo0RcBsFci0p_9r583LsBFiOywfVyEfN74rJ4BtM/exec"; // Google Apps Script URL

            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    let blogUrl = data.blogUrl || "Direct Visit";

                    console.log("가져온 최신 블로그 URL:", blogUrl);

                    if (blogUrl !== "Direct Visit" && blogUrl.includes("blog.naver.com")) {
                        // Google Sheets에 저장
                        const sheetUrl = "https://script.google.com/macros/s/AKfycbyP4u2E-NQuY7Q9eKWpViLcQHxCo0RcBsFci0p_9r583LsBFiOywfVyEfN74rJ4BtM/exec";
                        const sendData = {
                            blogUrl: blogUrl,
                            timestamp: new Date().toISOString()
                        };

                        fetch(sheetUrl, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(sendData),
                            mode: "no-cors"
                        }).then(() => {
                            console.log("Google Sheets에 저장 요청 완료");
                        }).catch(error => {
                            console.error("Google Sheets 저장 오류:", error);
                        });

                        // 블로그로 리디렉션
                        setTimeout(() => {
                            window.location.replace(blogUrl);
                        }, 500);
                    } else {
                        console.warn("블로그 URL이 감지되지 않음.");
                    }
                })
                .catch(error => {
                    console.error("최신 블로그 URL 가져오기 실패:", error);
                });
        }

        window.onload = fetchLatestBlogUrl;
    </script>
</head>
<body>
    <p>잠시만 기다려 주세요...</p>
</body>
</html>
